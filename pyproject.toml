[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hust-XGCN"
version = "0.0.1"
description = "Setting up a python package"
authors = [{ name = "Xiran Song", email = "xiransong@outlook.com" }]
dependencies = [
    "dgl==0.9.1",
    "gensim==4.2.0",
    "numba==0.55.1",
    "numpy==1.21.5",
    "PyYAML==6.0",
    "setuptools~=64.0.0",
    "torch==1.9.0",
    "torch-cluster",
    "torch-scatter",
    "torch-sparse",
    "torch-spline-conv",
    "torch_geometric==2.0.4",
    "tqdm==4.63.0",
    "wheel==0.46.3",
]
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = "~=3.9.0"

[tool.setuptools]
packages = ["XGCN"]

[tool.uv.workspace]
members = [".", "."]

[tool.uv.sources]
hust-xgcn = { workspace = true, editable = true }
torch-scatter = { url = "https://data.pyg.org/whl/torch-1.9.0%2Bcu102/torch_scatter-2.0.8-cp39-cp39-linux_x86_64.whl" }
torch-sparse = { url = "https://data.pyg.org/whl/torch-1.9.0%2Bcu102/torch_sparse-0.6.12-cp39-cp39-linux_x86_64.whl" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-1.9.0%2Bcu102/torch_cluster-1.5.9-cp39-cp39-linux_x86_64.whl" }
torch-spline-conv = { url = "https://data.pyg.org/whl/torch-1.9.0%2Bcu102/torch_spline_conv-1.2.1-cp39-cp39-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "hust-xgcn",
    "notebook>=7.5.5",
]

[tool.uv.extra-build-dependencies]
torch-cluster = ["torch"]
torch-sparse = ["torch"]
torch-scatter = ["torch"]
torch-spline-conv = ["torch"]
